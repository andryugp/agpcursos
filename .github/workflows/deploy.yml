name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inject GitHub PAT token for Decap CMS
        env:
          PAT_TOKEN: ${{ secrets.AGPCURSOS_PAT }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            sed -i.bak "s/YOUR_PAT_TOKEN_HERE/$PAT_TOKEN/g" admin/config.yml && rm -f admin/config.yml.bak
          else
            echo "Warning: AGPCURSOS_PAT secret not found. CMS will not be functional for editing."
          fi

      - name: Setup Pages
        id: setup
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Include all static files including admin/, data/, and root HTML files
          # This ensures Decap CMS admin interface and data files are deployed

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4