<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // This allows Decap CMS to work properly with client-side routing
      var directions = [
        "admin",
        "index.html"
      ];

      if (window.location.pathname == "/404.html") {
        window.history.replaceState({}, "", "/index.html");
      } else {
        var hash = window.location.hash;
        if (hash) {
          window.location.href = directions[0] + "/" + hash.slice(1);
          return;
        }
      }
      document.write('<base target="_top">');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
