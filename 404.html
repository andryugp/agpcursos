<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages client-side routing handler for Decap CMS
    // Redirect to admin if accessing /admin route, otherwise to home
    var path = window.location.pathname;
    if (path.indexOf('/admin') === 0) {
      window.location.href = '/admin/index.html';
    } else {
      window.location.href = '/';
    }
  </script>
</head>
<body>
  <p>Redirecting... <a href="/">Home</a></p>
</body>
</html>
