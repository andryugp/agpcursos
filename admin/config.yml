backend:
  name: github
  repo: andryugp/agpcursos
  branch: master
  # Token será inyectado automáticamente por GitHub Actions
  # usando GitHub App credentials
  token: "${GITHUB_TOKEN}"

media_folder: "images"
public_folder: "/images"

# Publicación directa (sin editorial workflow)
# Si necesitas workflow editorial, usa: publish_mode: editorial_workflow

collections:
  - name: "cursos"
    label: "Cursos"
    folder: "data"
    create: false
    slug: ""
    file: "cursos.json"
    fields:
      - label: "Cursos"
        name: "cursos"
        widget: "list"
        fields:
          - {label: "ID", name: "id", widget: "string", hint: "curso-001, curso-002, etc."}
          - {label: "Título", name: "titulo", widget: "string"}
          - {label: "Descripción", name: "descripcion", widget: "text", required: false}
          - label: "Categoría"
            name: "categoria"
            widget: "select"
            options: ["Desarrollo", "Negocios", "Finanzas y Contabilidad", "Informática y Software", "Inteligencia artificial", "Productividad en la Oficina", "Desarrollo Personal", "Diseño", "Marketing", "Salud y Fitness", "Música", "Enseñanza y Académicas"]
          - {label: "Subcategoría", name: "subcategoria", widget: "string", required: false}
          - label: "Nivel"
            name: "nivel"
            widget: "select"
            options: ["principiante", "intermedio", "avanzado"]
          - {label: "Duración", name: "duracion", widget: "string", hint: "40 horas"}
          - {label: "URL del Video (YouTube)", name: "video_url", widget: "string"}
          - {label: "URL de Fallback (Invidious)", name: "video_fallback", widget: "string", hint: "https://yewtu.be/watch?v=..."}
          - {label: "Módulo", name: "modulo", widget: "string"}
          - {label: "Fecha de Publicación", name: "fecha_publicacion", widget: "date", format: "YYYY-MM-DD", required: false}
          - {label: "Instructor", name: "instructor", widget: "string", required: false}

  - name: "categorias"
    label: "Categorías"
    folder: "data"
    create: false
    slug: ""
    file: "categorias.json"
    fields:
      - label: "Categorías"
        name: "categorias"
        widget: "list"
        fields:
          - {label: "Nombre", name: "nombre", widget: "string"}